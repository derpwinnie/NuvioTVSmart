# Publish the VIDAA build to GitHub Pages, so a launcher tile has a stable
# https address to open. Manual trigger only: enabling Pages creates a public
# site, so the maintainer starts this deliberately.
name: Publish VIDAA build to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # package:vidaa builds the static VIDAA bundle into dist/vidaa
      # (vidaa.html, sw.js, hashed file names).
      - run: npm run package:vidaa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/vidaa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
